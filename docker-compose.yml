version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: arima-uss:latest
    container_name: arima_app
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      APP_NAME: "${APP_NAME:-ARIMA Universitas Sumatera Selatan}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8085}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-arima_db}"
      DB_USERNAME: "${DB_USERNAME:-arima_user}"
      DB_PASSWORD: "${DB_PASSWORD:-arima_password_secret}"
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
    volumes:
      - arima_storage:/var/www/html/storage/app/public
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: arima_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-arima_db}"
      MYSQL_USER: "${DB_USERNAME:-arima_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-arima_password_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password_secret}"
    volumes:
      - arima_db_data:/var/lib/mysql
    ports:
      - "33067:3306"

volumes:
  arima_storage:
  arima_db_data:
